<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>污水处理智能管控系统</title><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#020b18;color:#e0f4ff;font-family:sans-serif;overflow:hidden;height:100vh;width:100vw}#c{position:fixed;top:0;left:0;width:100%;height:100%}#hd{position:fixed;top:0;left:0;right:0;padding:12px 20px;background:rgba(0,5,15,.95);border-bottom:1px solid rgba(0,245,255,.15);display:flex;align-items:center;justify-content:space-between;z-index:100}#hd h1{font-size:13px;color:#00f5ff;letter-spacing:2px}#lp{position:fixed;left:15px;top:55px;width:195px;z-index:100;display:flex;flex-direction:column;gap:8px}#rp{position:fixed;right:15px;top:55px;width:180px;z-index:100;display:flex;flex-direction:column;gap:8px}.pc{background:rgba(0,20,40,.85);border:1px solid rgba(0,245,255,.2);border-radius:8px;padding:12px}.pc h3{font-size:9px;color:#00f5ff;letter-spacing:2px;margin-bottom:10px}.mi{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:5px;cursor:pointer;margin-bottom:3px;border:1px solid transparent;font-size:11px}.mi:hover,.mi.act{background:rgba(0,245,255,.08);border-color:rgba(0,245,255,.3)}.mic{width:24px;height:24px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:12px}.minn{font-weight:700;color:#c8e8ff;font-size:11px}.mind{font-size:9px;color:rgba(150,200,230,.5)}.mt{margin-bottom:8px}.ml{display:flex;justify-content:space-between;font-size:10px;margin-bottom:3px;color:rgba(180,220,255,.8)}.mv{color:#00f5ff;font-family:monospace;font-size:11px}.bb{height:4px;background:rgba(0,100,150,.3);border-radius:3px;overflow:hidden}.bf{height:100%;border-radius:3px;transition:width 1s}#bc{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);z-index:100;display:flex;gap:6px;background:rgba(0,10,25,.85);border:1px solid rgba(0,245,255,.2);border-radius:40px;padding:8px 14px}.cb{padding:6px 12px;border-radius:20px;border:1px solid rgba(0,245,255,.3);background:rgba(0,30,60,.8);color:#00f5ff;font-size:9px;cursor:pointer}.cb:hover{background:rgba(0,60,100,.8)}.dr{border-color:rgba(255,100,130,.4);color:#ff6688;background:rgba(60,0,20,.8)}#fs{position:fixed;bottom:55px;left:50%;transform:translateX(-50%);font-size:10px;color:rgba(0,245,255,.6);letter-spacing:1px;pointer-events:none;white-space:nowrap}#tt{position:fixed;z-index:200;background:rgba(0,10,30,.95);border:1px solid rgba(0,245,255,.4);border-radius:8px;padding:12px;max-width:210px;display:none}.tth{font-size:10px;color:#00f5ff;margin-bottom:6px;font-weight:bold}.ttp{font-size:10px;color:rgba(180,220,255,.8);line-height:1.6}.tts{margin-top:6px}.ttsr{display:flex;justify-content:space-between;font-size:9px;padding:2px 0;border-bottom:1px solid rgba(0,100,150,.2);color:rgba(150,200,230,.7)}.ttsr span:last-child{color:#00ff88}</style></head><body><div id="c"></div><div id="hd"><h1>污水处理智能管控系统·数字孪生样机</h1><span style="font-size:10px;color:rgba(0,245,255,.6)">● 系统运行中</span></div><div id="lp"><div class="pc"><h3>系统模块</h3><div class="mi act" id="m0" onclick="fm(0)"><div class="mic" style="background:rgba(0,100,200,.3)">🏭</div><div><div class="minn">进水调节池</div><div class="mind">Inlet Tank</div></div></div><div class="mi" id="m1" onclick="fm(1)"><div class="mic" style="background:rgba(0,160,100,.3)">⚗️</div><div><div class="minn">絮凝反应池</div><div class="mind">Flocculation</div></div></div><div class="mi" id="m2" onclick="fm(2)"><div class="mic" style="background:rgba(0,80,160,.3)">🔵</div><div><div class="minn">沉淀澄清池</div><div class="mind">Sedimentation</div></div></div><div class="mi" id="m3" onclick="fm(3)"><div class="mic" style="background:rgba(180,60,0,.3)">🦾</div><div><div class="minn">伺服加药臂</div><div class="mind">Servo Arm XYZ</div></div></div><div class="mi" id="m4" onclick="fm(4)"><div class="mic" style="background:rgba(100,0,180,.3)">📡</div><div><div class="minn">传感器阵列</div><div class="mind">Sensor Array</div></div></div><div class="mi" id="m5" onclick="fm(5)"><div class="mic" style="background:rgba(0,160,160,.3)">💧</div><div><div class="minn">清水排放池</div><div class="mind">Output Tank</div></div></div></div><div class="pc"><h3>实时参数</h3><div class="mt"><div class="ml"><span>PH值</span><span class="mv" id="ph">7.2</span></div><div class="bb"><div class="bf" id="pb" style="width:72%;background:linear-gradient(90deg,#00ff88,#00ccff)"></div></div></div><div class="mt"><div class="ml"><span>流量 L/min</span><span class="mv" id="fl">42.8</span></div><div class="bb"><div class="bf" id="fb" style="width:43%;background:linear-gradient(90deg,#0066ff,#00ccff)"></div></div></div><div class="mt"><div class="ml"><span>COD mg/L</span><span class="mv" id="cd">38.5</span></div><div class="bb"><div class="bf" id="cb2" style="width:38%;background:linear-gradient(90deg,#ff6600,#ffaa00)"></div></div></div><div class="mt"><div class="ml"><span>轨迹误差</span><span class="mv" id="tr">0.02mm</span></div><div class="bb"><div class="bf" id="tb" style="width:20%;background:linear-gradient(90deg,#00ff88,#00ff44)"></div></div></div></div></div><div id="rp"><div class="pc"><h3>工序状态</h3><div id="ps"></div></div><div class="pc"><h3>控制器</h3><div style="font-size:10px;color:rgba(150,200,230,.7);line-height:2"><div>型号: <span style="color:#00f5ff">GNC-400</span></div><div>总线: <span style="color:#00ff88">EtherCAT</span></div><div>轴数: <span style="color:#00f5ff">3轴</span></div><div>周期: <span style="color:#00f5ff">100kHz</span></div><div>延迟: <span style="color:#00ff88">≤0.5ms</span></div></div></div></div><div id="bc"><button class="cb" onclick="arot=!arot">⟳ 旋转</button><button class="cb" onclick="rc()">⌂ 重置</button><button class="cb" onclick="tsim(this)">⏸ 仿真</button><button class="cb" onclick="tv()">↑ 俯视</button><button class="cb" onclick="sv()">→ 侧视</button><button class="cb dr" onclick="alm()">⚠ 报警</button></div><div id="fs">● 污水处理流程运行中·工序: 絮凝加药</div><div id="tt"></div><script>const MI=[{name:'进水调节池',desc:'收集工业废水，液位传感器实时监控，调节进水速率。',specs:[['容积','2.4m³'],['传感器','超声波'],['响应','≤100ms'],['控制','PLC']]},{name:'絮凝反应池',desc:'伺服加药臂投加絮凝剂PAC，搅拌机充分混合成矾花。',specs:[['加药精度','≤0.03mm'],['搅拌','120rpm'],['药量','动态调节'],['停留','15min']]},{name:'沉淀澄清池',desc:'矾花重力沉降，上清液溢流，污泥自动定期排出。',specs:[['沉淀效率','≥92%'],['SS去除','≥85%'],['含水率','≤98%'],['填料','蜂窝型']]},{name:'伺服加药臂',desc:'三轴伺服联动精密加药，S曲线加减速，轨迹误差≤0.03mm。',specs:[['轴数','X-Y-Z'],['误差','≤0.03mm'],['延迟','≤0.5ms'],['曲线','S型']]},{name:'传感器阵列',desc:'全流程PH/COD/流量传感器，EtherCAT总线100kHz采集。',specs:[['PH精度','±0.05'],['COD','0~500mg/L'],['协议','EtherCAT'],['频率','100kHz']]},{name:'清水排放池',desc:'处理达标清水，COD≤50mg/L，符合国家一级排放标准。',specs:[['COD','≤50mg/L'],['SS','≤10mg/L'],['标准','GB18918'],['排放','自动']]}];const scene=new THREE.Scene();scene.background=new THREE.Color(0x020b18);scene.fog=new THREE.FogExp2(0x020b18,.03);const W=window.innerWidth,H=window.innerHeight;const cam=new THREE.PerspectiveCamera(55,W/H,.1,200);cam.position.set(12,8,16);cam.lookAt(0,0,0);const ren=new THREE.WebGLRenderer({antialias:true});ren.setSize(W,H);ren.setPixelRatio(Math.min(devicePixelRatio,2));ren.shadowMap.enabled=true;document.getElementById('c').appendChild(ren.domElement);scene.add(new THREE.AmbientLight(0x0a1a2e,3));const dl=new THREE.DirectionalLight(0x4488ff,2);dl.position.set(10,15,10);dl.castShadow=true;scene.add(dl);const pl=new THREE.PointLight(0x00ffcc,1.5,30);pl.position.set(-8,5,5);scene.add(pl);const gr=new THREE.GridHelper(40,40,0x003355,0x001a2e);gr.position.y=-2.5;scene.add(gr);function mk(w,h,d,px,py,pz,col,idx){const g=new THREE.Group();const geo=new THREE.BoxGeometry(w,h,d);const mat=new THREE.MeshStandardMaterial({color:col,metalness:.8,roughness:.2,transparent:true,opacity:.85});const m=new THREE.Mesh(geo,mat);m.castShadow=true;m.userData={mi:idx};g.add(m);const eg=new THREE.EdgesGeometry(geo);g.add(new THREE.LineSegments(eg,new THREE.LineBasicMaterial({color:0x00aaff,transparent:true,opacity:.6})));const wt=new THREE.Mesh(new THREE.BoxGeometry(w-.1,h*.6,d-.1),new THREE.MeshStandardMaterial({color:0x0044aa,transparent:true,opacity:.5}));wt.position.y=-h*.2;g.add(wt);g.position.set(px,py,pz);scene.add(g);}mk(3,3.5,2.8,-6,-.75,-4,0x1a3355,0);mk(3,3,2.8,0,-.5,-4,0x1a4433,1);mk(3.5,3,2.8,6.2,-.5,-4,0x1a2a44,2);mk(3,2.5,2.8,6.2,-.75,2,0x004433,5);function pipe(x1,y1,z1,x2,y2,z2,c){const d=new THREE.Vector3(x2-x1,y2-y1,z2-z1),l=d.length();const m=new THREE.Mesh(new THREE.CylinderGeometry(.12,.12,l,8),new THREE.MeshStandardMaterial({color:c||0x2244aa,metalness:.9}));m.position.set((x1+x2)/2,(y1+y2)/2,(z1+z2)/2);d.normalize();m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d);scene.add(m);}pipe(-4.5,-.5,-4,-1.5,-.5,-4);pipe(1.5,-.5,-4,4.5,-.5,-4);pipe(6.2,-.5,-2.5,6.2,-.5,.5);pipe(.5,1,1.5,.5,1,-2.5,0xff6600);const ag=new THREE.Group();ag.position.set(0,0,2);const bm=new THREE.Mesh(new THREE.CylinderGeometry(.6,.8,.5,16),new THREE.MeshStandardMaterial({color:0x223344,metalness:.9}));bm.userData={mi:3};ag.add(bm);const sh=new THREE.Mesh(new THREE.BoxGeometry(.4,2.2,.4),new THREE.MeshStandardMaterial({color:0x334455,metalness:.9}));sh.position.y=1.35;sh.userData={mi:3};ag.add(sh);const fa=new THREE.Mesh(new THREE.BoxGeometry(.35,1.8,.35),new THREE.MeshStandardMaterial({color:0xff6600,emissive:0x441100,metalness:.8}));fa.position.set(.7,2.4,0);fa.rotation.z=-Math.PI/6;fa.userData={mi:3};ag.add(fa);const nz=new THREE.Mesh(new THREE.CylinderGeometry(.12,.18,.6,8),new THREE.MeshStandardMaterial({color:0xffaa00,metalness:.95}));nz.position.set(1.2,1.6,0);nz.rotation.z=Math.PI/3;nz.userData={mi:3};ag.add(nz);scene.add(ag);[[-6,.8,-4],[0,.8,-4],[6.2,.8,-4],[6.2,.8,2],[-3,.8,0],[3,.8,0]].forEach(p=>{const s=new THREE.Mesh(new THREE.CylinderGeometry(.1,.1,1.5,8),new THREE.MeshStandardMaterial({color:0x8800ff,emissive:0x330066}));s.position.set(p[0]+.8,p[1],p[2]+.8);s.userData={mi:4};scene.add(s);const gw=new THREE.Mesh(new THREE.SphereGeometry(.15,8,8),new THREE.MeshStandardMaterial({color:0xcc44ff,emissive:0x8800ff}));gw.position.set(p[0]+.8,p[1]+.75,p[2]+.8);gw.userData={sg:true,mi:4};scene.add(gw);});const pc=150,pg=new THREE.BufferGeometry(),pa=new Float32Array(pc*3),pf=[];for(let i=0;i<pc;i++){pa[i*3]=-4.5+Math.random()*10;pa[i*3+1]=-.5;pa[i*3+2]=-4+Math.random()*.4;pf.push({t:Math.random(),s:.002+Math.random()*.003});}pg.setAttribute('position',new THREE.BufferAttribute(pa,3));const pts=new THREE.Points(pg,new THREE.PointsMaterial({size:.14,color:0x00ccff,transparent:true,opacity:.8}));scene.add(pts);const steps=['进水调节','絮凝加药','沉淀分离','清水排放'];const pse=document.getElementById('ps');steps.forEach((s,i)=>{const d=document.createElement('div');d.id='st'+i;d.style.cssText='display:flex;align-items:center;gap:8px;padding:5px 0;font-size:10px;border-bottom:1px solid rgba(0,100,150,.2)';d.innerHTML=`<div style="width:16px;height:16px;border-radius:50%;background:rgba(0,100,150,.4);border:1px solid rgba(0,150,200,.3);display:flex;align-items:center;justify-content:center;font-size:8px">${i+1}</div><span style="color:rgba(150,200,230,.7)">${s}</span>`;pse.appendChild(d);});function usp(idx){steps.forEach((_,i)=>{const el=document.getElementById('st'+i);if(!el)return;const dt=el.querySelector('div');if(i===idx){dt.style.background='rgba(0,255,136,.4)';dt.style.borderColor='#00ff88';el.children[1].style.color='#00ff88';}else if(i<idx){dt.style.background='rgba(0,100,200,.4)';dt.style.borderColor='rgba(0,150,255,.5)';el.children[1].style.color='rgba(0,200,255,.6)';}else{dt.style.background='rgba(0,50,80,.3)';dt.style.borderColor='rgba(0,100,150,.3)';el.children[1].style.color='rgba(100,150,180,.5)';}});}usp(1);let th=.5,ph=.5,rd=22,drag=false,pm={x:0,y:0},arot=false,sim=true,t=0,si=1,st=0;function uc(){cam.position.x=rd*Math.sin(ph)*Math.sin(th);cam.position.y=rd*Math.cos(ph);cam.position.z=rd*Math.sin(ph)*Math.cos(th);cam.lookAt(0,0,0);}ren.domElement.addEventListener('mousedown',e=>{drag=true;pm={x:e.clientX,y:e.clientY};});ren.domElement.addEventListener('mouseup',()=>drag=false);ren.domElement.addEventListener('mousemove',e=>{if(!drag)return;th-=(e.clientX-pm.x)*.01;ph=Math.max(.2,Math.min(1.4,ph+(e.clientY-pm.y)*.01));pm={x:e.clientX,y:e.clientY};uc();});ren.domElement.addEventListener('wheel',e=>{rd=Math.max(8,Math.min(40,rd+e.deltaY*.04));uc();});let lt=null;ren.domElement.addEventListener('touchstart',e=>{lt=e.touches[0];});ren.domElement.addEventListener('touchmove',e=>{if(!lt)return;th-=(e.touches[0].clientX-lt.clientX)*.01;ph=Math.max(.2,Math.min(1.4,ph+(e.touches[0].clientY-lt.clientY)*.01));lt=e.touches[0];uc();});const rc2=new THREE.Raycaster(),mc=new THREE.Vector2();ren.domElement.addEventListener('click',e=>{mc.x=(e.clientX/W)*2-1;mc.y=-(e.clientY/H)*2+1;rc2.setFromCamera(mc,cam);const all=[];scene.traverse(o=>{if(o.isMesh&&o.userData.mi!==undefined)all.push(o);});const h=rc2.intersectObjects(all);if(h.length>0){const idx=h[0].object.userData.mi;if(idx!==undefined){const info=MI[idx];const tt=document.getElementById('tt');tt.innerHTML=`<div class="tth">${info.name}</div><div class="ttp">${info.desc}</div><div class="tts">${info.specs.map(s=>`<div class="ttsr"><span>${s[0]}</span><span>${s[1]}</span></div>`).join('')}</div>`;tt.style.display='block';tt.style.left=Math.min(e.clientX+12,W-225)+'px';tt.style.top=Math.min(e.clientY+12,H-160)+'px';document.querySelectorAll('.mi').forEach((el,i)=>el.classList.toggle('act',i===idx));}}else document.getElementById('tt').style.display='none';});window.rc=()=>{th=.5;ph=.5;rd=22;arot=false;uc();document.getElementById('tt').style.display='none';};window.tv=()=>{ph=.22;rd=24;uc();};window.sv=()=>{th=Math.PI/2;ph=Math.PI/3;rd=22;uc();};window.tsim=function(btn){sim=!sim;btn.textContent=sim?'⏸ 仿真':'▶ 仿真';};window.alm=()=>{const fs=document.getElementById('fs');fs.textContent='⚠ 警报：水质异常！系统急停';fs.style.color='rgba(255,80,80,.9)';setTimeout(()=>{fs.textContent='● 污水处理流程运行中·工序: '+steps[si];fs.style.color='rgba(0,245,255,.6)';},3000);};window.fm=idx=>{const fp=[{th:-.8,ph:.5,r:14},{th:0,ph:.5,r:14},{th:.8,ph:.5,r:14},{th:.1,ph:.55,r:10},{th:0,ph:.4,r:20},{th:.9,ph:.5,r:14}];const f=fp[idx];if(!f)return;th=f.th;ph=f.ph;rd=f.r;uc();document.querySelectorAll('.mi').forEach((el,i)=>el.classList.toggle('act',i===idx));};function anim(){requestAnimationFrame(anim);if(sim)t+=.016;if(arot){th+=.004;uc();}fa.rotation.z=-Math.PI/6+Math.sin(t*.5)*.4;nz.position.x=1.2+Math.sin(t*.5)*.3;nz.position.z=Math.sin(t*.7)*.4;if(sim){const p=pg.attributes.position.array;for(let i=0;i<pc;i++){pf[i].t+=pf[i].s;if(pf[i].t>1)pf[i].t=0;p[i*3]=-4.5+pf[i].t*10.7;p[i*3+1]=-.5+Math.sin(pf[i].t*Math.PI*4)*.1;p[i*3+2]=-4+Math.sin(pf[i].t*Math.PI*2)*.3;}pg.attributes.position.needsUpdate=true;st+=.016;if(st>4){st=0;si=(si+1)%4;usp(si);document.getElementById('fs').textContent='● 污水处理流程运行中·工序: '+steps[si];}scene.traverse(o=>{if(o.userData.sg&&o.material)o.material.emissiveIntensity=.5+Math.sin(t*3+o.position.x)*.4;});}document.getElementById('ph').textContent=(7+Math.sin(t*.3)*.4).toFixed(1);document.getElementById('fl').textContent=(42+Math.sin(t*.5)*8).toFixed(1);document.getElementById('cd').textContent=(38+Math.sin(t*.2)*5).toFixed(1);document.getElementById('tr').textContent=(0.01+Math.abs(Math.sin(t*2))*.015).toFixed(3)+'mm';document.getElementById('pb').style.width=((7+Math.sin(t*.3)*.4)/14*100)+'%';document.getElementById('fb').style.width=((42+Math.sin(t*.5)*8)/100*100)+'%';document.getElementById('cb2').style.width=((38+Math.sin(t*.2)*5)/200*100)+'%';document.getElementById('tb').style.width=((0.01+Math.abs(Math.sin(t*2))*.015)/.05*100)+'%';ren.render(scene,cam);}uc();anim();window.addEventListener('resize',()=>{cam.aspect=window.innerWidth/window.innerHeight;cam.updateProjectionMatrix();ren.setSize(window.innerWidth,window.innerHeight);});</script></body></html>
