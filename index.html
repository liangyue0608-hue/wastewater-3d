<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>污水处理智能管控系统</title><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#020b18;color:#e0f4ff;font-family:sans-serif;overflow:hidden;height:100vh}#c{position:fixed;top:0;left:0;width:100%;height:100%}#ui{position:fixed;top:0;left:0;right:0;padding:10px 20px;background:rgba(0,5,15,0.9);border-bottom:1px solid rgba(0,245,255,0.2);display:flex;justify-content:space-between;align-items:center;z-index:10}h1{font-size:13px;color:#00f5ff;letter-spacing:2px}#panel{position:fixed;left:15px;top:55px;background:rgba(0,20,40,0.85);border:1px solid rgba(0,245,255,0.2);border-radius:8px;padding:12px;width:160px;font-size:11px;z-index:10}#rp{position:fixed;right:15px;top:55px;background:rgba(0,20,40,0.85);border:1px solid rgba(0,245,255,0.2);border-radius:8px;padding:12px;width:150px;font-size:11px;z-index:10}.sec{color:#00f5ff;letter-spacing:1px;margin-bottom:8px;font-size:10px}.row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid rgba(0,100,150,0.2)}.val{color:#00ff88;font-family:monospace}#btns{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:10}button{padding:7px 14px;border-radius:20px;border:1px solid rgba(0,245,255,0.3);background:rgba(0,30,60,0.8);color:#00f5ff;font-size:10px;cursor:pointer}button:hover{background:rgba(0,60,100,0.8)}#tip{position:fixed;bottom:55px;left:50%;transform:translateX(-50%);font-size:10px;color:rgba(0,245,255,0.5);letter-spacing:1px}</style></head><body><div id="c"></div><div id="ui"><h1>污水处理智能管控系统 · 数字孪生样机</h1><span style="font-size:10px;color:rgba(0,245,255,0.6)">● 系统运行中</span></div><div id="panel"><div class="sec">实时参数</div><div class="row"><span>PH值</span><span class="val" id="ph">7.2</span></div><div class="row"><span>流量</span><span class="val" id="fl">42L/m</span></div><div class="row"><span>COD</span><span class="val" id="cod">38mg/L</span></div><div class="row"><span>轨迹误差</span><span class="val" id="tr">0.02mm</span></div><div class="row"><span>工序</span><span class="val" id="st">絮凝</span></div></div><div id="rp"><div class="sec">控制器参数</div><div class="row"><span>型号</span><span class="val">GNC-400</span></div><div class="row"><span>总线</span><span class="val">EtherCAT</span></div><div class="row"><span>轴数</span><span class="val">3轴</span></div><div class="row"><span>周期</span><span class="val">100kHz</span></div><div class="row"><span>延迟</span><span class="val">≤0.5ms</span></div></div><div id="btns"><button onclick="ar=!ar">⟳ 自动旋转</button><button onclick="resetCam()">⌂ 重置</button><button onclick="topV()">↑ 俯视</button><button onclick="alarm()">⚠ 报警</button></div><div id="tip">拖动旋转 · 滚轮缩放 · 点击查看模块</div><script>const scene=new THREE.Scene();scene.background=new THREE.Color(0x020b18);scene.fog=new THREE.FogExp2(0x020b18,0.03);const W=window.innerWidth,H=window.innerHeight;const cam=new THREE.PerspectiveCamera(55,W/H,0.1,200);cam.position.set(12,8,16);cam.lookAt(0,0,0);const ren=new THREE.WebGLRenderer({antialias:true});ren.setSize(W,H);ren.shadowMap.enabled=true;document.getElementById('c').appendChild(ren.domElement);scene.add(new THREE.AmbientLight(0x0a1a2e,3));const dl=new THREE.DirectionalLight(0x4488ff,2);dl.position.set(10,15,10);dl.castShadow=true;scene.add(dl);const pl=new THREE.PointLight(0x00ffcc,1.5,30);pl.position.set(-8,5,5);scene.add(pl);const grid=new THREE.GridHelper(40,40,0x003355,0x001a2e);grid.position.y=-2.5;scene.add(grid);function tank(w,h,d,px,py,pz,col){const g=new THREE.Group();const geo=new THREE.BoxGeometry(w,h,d);const mat=new THREE.MeshStandardMaterial({color:col,metalness:0.8,roughness:0.2,transparent:true,opacity:0.85});const m=new THREE.Mesh(geo,mat);m.castShadow=true;g.add(m);const eg=new THREE.EdgesGeometry(geo);const el=new THREE.LineSegments(eg,new THREE.LineBasicMaterial({color:0x00aaff,transparent:true,opacity:0.6}));g.add(el);const wg=new THREE.BoxGeometry(w-0.1,h*0.6,d-0.1);const wm=new THREE.MeshStandardMaterial({color:0x0044aa,transparent:true,opacity:0.5});const wt=new THREE.Mesh(wg,wm);wt.position.y=-h*0.2;g.add(wt);g.position.set(px,py,pz);scene.add(g);return g;}tank(3,3.5,2.8,-6,-0.75,-4,0x1a3355);tank(3,3,2.8,0,-0.5,-4,0x1a4433);tank(3.5,3,2.8,6.2,-0.5,-4,0x1a2a44);tank(3,2.5,2.8,6.2,-0.75,2,0x004433);function pipe(x1,y1,z1,x2,y2,z2,col){const dir=new THREE.Vector3(x2-x1,y2-y1,z2-z1);const len=dir.length();const geo=new THREE.CylinderGeometry(0.12,0.12,len,8);const mat=new THREE.MeshStandardMaterial({color:col||0x2244aa,metalness:0.9});const m=new THREE.Mesh(geo,mat);m.position.set((x1+x2)/2,(y1+y2)/2,(z1+z2)/2);dir.normalize();m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir);scene.add(m);}pipe(-4.5,-0.5,-4,-1.5,-0.5,-4);pipe(1.5,-0.5,-4,4.5,-0.5,-4);pipe(6.2,-0.5,-2.5,6.2,-0.5,0.5);pipe(0.5,1,1.5,0.5,1,-2.5,0xff6600);const ag=new THREE.Group();ag.position.set(0,0,2);const bm=new THREE.Mesh(new THREE.CylinderGeometry(0.6,0.8,0.5,16),new THREE.MeshStandardMaterial({color:0x223344,metalness:0.9}));ag.add(bm);const sh=new THREE.Mesh(new THREE.BoxGeometry(0.4,2.2,0.4),new THREE.MeshStandardMaterial({color:0x334455,metalness:0.9}));sh.position.y=1.35;ag.add(sh);const fa=new THREE.Mesh(new THREE.BoxGeometry(0.35,1.8,0.35),new THREE.MeshStandardMaterial({color:0xff6600,emissive:0x441100,metalness:0.8}));fa.position.set(0.7,2.4,0);fa.rotation.z=-Math.PI/6;ag.add(fa);const nz=new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.18,0.6,8),new THREE.MeshStandardMaterial({color:0xffaa00,metalness:0.95}));nz.position.set(1.2,1.6,0);nz.rotation.z=Math.PI/3;ag.add(nz);scene.add(ag);[[-6,0.8,-4],[0,0.8,-4],[6.2,0.8,-4],[6.2,0.8,2],[-3,0.8,0],[3,0.8,0]].forEach(p=>{const s=new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.1,1.5,8),new THREE.MeshStandardMaterial({color:0x8800ff,emissive:0x330066}));s.position.set(p[0]+0.8,p[1],p[2]+0.8);scene.add(s);const g=new THREE.Mesh(new THREE.SphereGeometry(0.15,8,8),new THREE.MeshStandardMaterial({color:0xcc44ff,emissive:0x8800ff}));g.position.set(p[0]+0.8,p[1]+0.75,p[2]+0.8);g.userData.sg=true;scene.add(g);});const pc=200;const pg=new THREE.BufferGeometry();const pp=new Float32Array(pc*3);const pf=[];for(let i=0;i<pc;i++){pp[i*3]=-4.5+Math.random()*10;pp[i*3+1]=-0.5;pp[i*3+2]=-4+Math.random()*0.4;pf.push({t:Math.random(),s:0.002+Math.random()*0.003});}pg.setAttribute('position',new THREE.BufferAttribute(pp,3));const pts=new THREE.Points(pg,new THREE.PointsMaterial({size:0.15,color:0x00ccff,transparent:true,opacity:0.8}));scene.add(pts);let th=0.5,ph2=0.5,rd=22,drag=false,pm={x:0,y:0},ar=false,t=0;const steps=['进水','絮凝','沉淀','排放'];let si=1,st=0;function updCam(){cam.position.x=rd*Math.sin(ph2)*Math.sin(th);cam.position.y=rd*Math.cos(ph2);cam.position.z=rd*Math.sin(ph2)*Math.cos(th);cam.lookAt(0,0,0);}ren.domElement.addEventListener('mousedown',e=>{drag=true;pm={x:e.clientX,y:e.clientY};});ren.domElement.addEventListener('mouseup',()=>drag=false);ren.domElement.addEventListener('mousemove',e=>{if(!drag)return;th-=(e.clientX-pm.x)*0.01;ph2=Math.max(0.2,Math.min(1.4,ph2+(e.clientY-pm.y)*0.01));pm={x:e.clientX,y:e.clientY};updCam();});ren.domElement.addEventListener('wheel',e=>{rd=Math.max(8,Math.min(40,rd+e.deltaY*0.04));updCam();});let lt=null;ren.domElement.addEventListener('touchstart',e=>lt=e.touches[0]);ren.domElement.addEventListener('touchmove',e=>{if(!lt)return;th-=(e.touches[0].clientX-lt.clientX)*0.01;ph2=Math.max(0.2,Math.min(1.4,ph2+(e.touches[0].clientY-lt.clientY)*0.01));lt=e.touches[0];updCam();});window.resetCam=()=>{th=0.5;ph2=0.5;rd=22;ar=false;updCam();};window.topV=()=>{ph2=0.22;rd=24;updCam();};window.alarm=()=>{document.getElementById('tip').textContent='⚠ 警报：水质异常！系统急停';document.getElementById('tip').style.color='rgba(255,80,80,0.9)';setTimeout(()=>{document.getElementById('tip').textContent='拖动旋转 · 滚轮缩放';document.getElementById('tip').style.color='rgba(0,245,255,0.5)';},3000);};function animate(){requestAnimationFrame(animate);t+=0.016;if(ar){th+=0.004;updCam();}fa.rotation.z=-Math.PI/6+Math.sin(t*0.5)*0.4;nz.position.x=1.2+Math.sin(t*0.5)*0.3;nz.position.z=Math.sin(t*0.7)*0.4;const pa=pg.attributes.position.array;for(let i=0;i<pc;i++){pf[i].t+=pf[i].s;if(pf[i].t>1)pf[i].t=0;pa[i*3]=-4.5+pf[i].t*10.7;pa[i*3+1]=-0.5+Math.sin(pf[i].t*Math.PI*4)*0.1;pa[i*3+2]=-4+Math.sin(pf[i].t*Math.PI*2)*0.3;}pg.attributes.position.needsUpdate=true;st+=0.016;if(st>4){st=0;si=(si+1)%4;document.getElementById('st').textContent=steps[si];}document.getElementById('ph').textContent=(7+Math.sin(t*0.3)*0.4).toFixed(1);document.getElementById('fl').textContent=(42+Math.sin(t*0.5)*8).toFixed(0)+'L/m';document.getElementById('cod').textContent=(38+Math.sin(t*0.2)*5).toFixed(0)+'mg/L';document.getElementById('tr').textContent=(0.01+Math.abs(Math.sin(t*2))*0.015).toFixed(3)+'mm';ren.render(scene,cam);}updCam();animate();window.addEventListener('resize',()=>{cam.aspect=window.innerWidth/window.innerHeight;cam.updateProjectionMatrix();ren.setSize(window.innerWidth,window.innerHeight);});</script></body></html>
